name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r app/requirements.txt -r api/requirements.txt
      - run: ruff check src api app tests --select F,E9
      - run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t gep-api .
      - name: Smoke-test the container
        run: |
          docker run -d --name gep -p 8000:8000 gep-api
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health && break || sleep 2; done
          curl -fs http://127.0.0.1:8000/health | grep ok
          curl -fs -X POST http://127.0.0.1:8000/plan -H 'content-type: application/json' \
            -d '{"kind":"rate","baseline":0.1,"rel_lift":0.2,"daily_users":1000}' | grep n_per_arm
